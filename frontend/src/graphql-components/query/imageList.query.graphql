query imageList($name: String!) {
  imageList: itPolitoCrownlabsV1alpha1ImageList(name: $name) {
    metadata {
      name
    }
    spec {
      projectBaseName
      registryName
      images {
        name
        versions
        versionDetails {
          version
          volumeSize
        }
      }
    }
  }
}
