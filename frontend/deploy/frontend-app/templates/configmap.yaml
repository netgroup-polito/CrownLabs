apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend-app.fullname" . }}
  labels:
    {{- include "frontend-app.labels" . | nindent 4 }}
data:
  {{ .Values.configuration.fileName }}: |
    window.VITE_APP_CROWNLABS_GRAPHQL_URL="{{ .Values.configuration.backend.graphql }}";
    window.VITE_APP_CROWNLABS_OIDC_CLIENT_ID="{{ .Values.configuration.oidc.clientId }}";
    window.VITE_APP_CROWNLABS_OIDC_AUTHORITY="{{ .Values.configuration.oidc.providerUrl }}realms/{{ .Values.configuration.oidc.realm }}/";
    window.VITE_APP_MYDRIVE_TEMPLATE_NAME="{{ .Values.configuration.mydrive.templateName }}";
    window.VITE_APP_MYDRIVE_WORKSPACE_NAME="{{ .Values.configuration.mydrive.workspaceName }}";

    window.VITE_APP_CROWNLABS_GROUPS_CLAIM_PREFIX="{{ .Values.configuration.oidc.claimPrefix }}";
    window.VITE_APP_CROWNLABS_GROUPS_ADMIN_CLAIM="{{ .Values.configuration.oidc.adminClaim }}";
    window.VITE_APP_CROWNLABS_GRAFANA_DASHBOARD_URL="{{ .Values.configuration.backend.grafana }}";
    window.VITE_APP_CROWNLABS_BASTION_HOST="{{ .Values.configuration.backend.bastion }}";
    window.VITE_APP_CROWNLABS_IMAGE_CREATION_WARNING={{ .Values.configuration.imageCreationWarning | quote }};
    window.VITE_APP_CROWNLABS_IMAGE_CREATION_HELP={{ .Values.configuration.imageCreationHelp | quote }};
    window.VITE_APP_CROWNLABS_PUBLIC_REGISTRY_NAME_DESTINATION={{ .Values.configuration.publicRegistryNameDestination | quote }};
    {{- if .Values.configuration.imagelist.enabled }}
    window.VITE_APP_CROWNLABS_IMAGELIST_STANDALONE={{ .Values.configuration.imagelist.standalone | quote }};
    window.VITE_APP_CROWNLABS_IMAGELIST_CONTAINERDISKS={{ .Values.configuration.imagelist.containerdisks | quote }};
    window.VITE_APP_CROWNLABS_IMAGELIST_PUBLIC_SNAPSHOTS={{ .Values.configuration.imagelist.publicSnapshots | quote }};
    {{- else }}
    window.VITE_APP_CROWNLABS_IMAGELIST_STANDALONE="harbor-standalone-pre-production";
    window.VITE_APP_CROWNLABS_IMAGELIST_CONTAINERDISKS="harbor-containerdisks-pre-production";
    window.VITE_APP_CROWNLABS_IMAGELIST_PUBLIC_SNAPSHOTS="public-local-snapshots-pre-production";
    {{- end }}
    window.VITE_APP_DEFAULT_STOP_AFTER_INACTIVITY="{{ .Values.configuration.defaultTimeouts.cleanup.stopAfterInactivity }}";
    window.VITE_APP_DEFAULT_DELETE_AFTER_INACTIVITY="{{ .Values.configuration.defaultTimeouts.cleanup.deleteAfterInactivity }}";
    window.VITE_APP_DEFAULT_DELETE_AFTER_CREATION="{{ .Values.configuration.defaultTimeouts.cleanup.deleteAfterCreation }}";
    window.VITE_APP_CUSTOM_RESOURCES = '{{ .Values.configuration.customResources | mustToJson }}';
