# Single ingress point for every locally-exposed dev-local service (Keycloak now,
# Mailpit later — see ../../mailpit/README.md), replacing the old per-service
# NodePort pattern with one Envoy Gateway fronting everything under one local
# domain (*.crownlabs.local).
#
# Requires:
# - cert-manager installed (see ../README.md step 0) — provides the wildcard
#   certificate below.
# - The Gateway API CRDs + Envoy Gateway controller installed first (../README.md
#   steps 1-2) — this file only contains the GatewayClass/Gateway/Certificate/
#   redirect, not the controller itself.
#
# TLS terminates here, at the Gateway edge — backends (Keycloak, later Mailpit)
# are plain HTTP behind it. This is what let Keycloak's own manifest drop its
# self-managed HTTPS certificate/probes entirely (see ../../keycloak/manifests/keycloak.yaml).
---
# Source: gateway-helm/templates/envoy-gateway-config.yaml
# Added "enableBackend: true" under "ExtensionApis"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
  labels:
    helm.sh/chart: gateway-helm-v0.0.0-latest
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: eg
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    extensionApis:
      enableBackend: true
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      kubernetes:
        rateLimitDeployment:
          container:
            image: docker.io/envoyproxy/ratelimit:1e50889b
          patch:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    containers:
                    - imagePullPolicy: IfNotPresent
                      name: envoy-ratelimit
        shutdownManager:
          image: envoyproxy/gateway:v1.8.2
      type: Kubernetes
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crownlabs-tls
  namespace: default
  labels:
    app: envoy-gateway
spec:
  secretName: crownlabs-tls
  commonName: "*.crownlabs.local"
  dnsNames:
    - "*.crownlabs.local"
    - "crownlabs.local"
  # Local dev only: a long duration avoids the local copies of the CA (k3s
  # --oidc-ca-file, the operator's SSL_CERT_FILE) going stale on renewal —
  # see ../../keycloak/apiserver-oidc-integration.md.
  duration: 87600h0m0s
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
  namespace: default
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: crownlabs
  namespace: default
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # Plain HTTP exists only to serve the redirect below — every real route is HTTPS.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.crownlabs.local"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.crownlabs.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: crownlabs-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: default
spec:
  parentRefs:
    - name: crownlabs
      sectionName: http
  hostnames:
    - "*.crownlabs.local"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: k3s-api
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: kubernetes.default.svc.cluster.local
        port: 443
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apiserver
  namespace: default
  labels:
    app: apiserver
spec:
  parentRefs:
    - name: crownlabs
      sectionName: https
  hostnames:
    - apiserver.crownlabs.local
  rules:
    - backendRefs:
      - name: k3s-api
        group: gateway.envoyproxy.io
        kind: Backend
