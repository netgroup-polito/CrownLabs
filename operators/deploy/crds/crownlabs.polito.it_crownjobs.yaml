---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: crownjobs.crownlabs.polito.it
spec:
  group: crownlabs.polito.it
  names:
    kind: CrownJob
    listKind: CrownJobList
    plural: crownjobs
    singular: crownjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          CrownJob is the Schema for the crownjobs API.
          Each CrownJob is one run of a batch job started from an Instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CrownJobSpec defines the desired state of CrownJob.
            properties:
              command:
                description: |-
                  Command is the command of the job, as a list of arguments (e.g., ["python", "train.py"]).
                  It is used only if the commandPolicy of the job section of the Template
                  is Editable (this is checked by the operator).
                items:
                  maxLength: 8192
                  type: string
                maxItems: 64
                type: array
              instanceRef:
                description: |-
                  Instance is the reference to the Instance whose environment is copied to
                  run the job. If the namespace is empty, the namespace of the CrownJob is used.
                properties:
                  name:
                    description: The name of the resource to be referenced.
                    type: string
                  namespace:
                    description: |-
                      The namespace containing the resource to be referenced. It should be left
                      empty in case of cluster-wide resources.
                    type: string
                required:
                - name
                type: object
              maxRunTime:
                description: |-
                  MaxRunTime is the maximum time this job may run, as a positive number of
                  at most four digits followed by a unit among m, h and d (e.g., 30m, 6h, 2d).
                  It can only lower the maxRunTime of the Template (this is checked by the
                  operator). If empty, the maxRunTime of the Template applies.
                pattern: ^[1-9][0-9]{0,3}[mhd]$
                type: string
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: CrownJob spec is immutable
              rule: self == oldSelf
          status:
            description: CrownJobStatus defines the observed state of CrownJob.
            properties:
              deadline:
                description: Deadline is the time at which the job will be stopped
                  if it is still running.
                format: date-time
                type: string
              message:
                description: Message is a plain sentence for the user describing the
                  current phase and its reason.
                type: string
              phase:
                description: Phase is the current phase of the job.
                enum:
                - Waiting
                - Starting
                - Running
                - Succeeded
                - Failed
                type: string
              queuePosition:
                description: QueuePosition is the position of the job in the queue
                  of the Workspace while it is waiting.
                format: int32
                type: integer
              reason:
                description: |-
                  Reason is the reason for the current phase, as a single CamelCase word
                  (e.g., InQueue, QuotaReached, ExitCode, TimeLimit, Canceled, CannotStart).
                type: string
              runFolder:
                description: |-
                  RunFolder is the path, on the disk of the Instance, of the folder that
                  holds the logs and outputs of this run (e.g., runs/<name>).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
