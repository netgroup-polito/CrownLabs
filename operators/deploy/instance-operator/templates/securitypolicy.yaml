{{- if and (.Values.configurations.generic.gatewayApiMode | default .Values.global.gateway.gatewayApiMode | default true) (.Values.configurations.generic.enableAuthentication | default true) (.Values.securityPolicyTemplate.enabled | default true) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.securityPolicyTemplate.spec.oidc.clientSecret.name | default "secpol-dummy-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "instance-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: "dummy"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "instance-operator.fullname" . }}-auth-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "instance-operator.labels" . | nindent 4 }}
spec:
  targetRefs: []
  {{- toYaml .Values.securityPolicyTemplate.spec | nindent 2 }}
{{- end }}
