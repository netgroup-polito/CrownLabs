# Default values for operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

configurations:
  features:
    tenant: true
    workspace: true
    instance: true
    instanceSnapshot: true
    sharedvolume: true
    pmp: false
    keycloak: true
    webhooks: false
    imageList: false
    # The CrownJob controllers ("Run job"): they need Kueue, serving kueue.x-k8s.io/v1beta2.
    crownJob: false

  # Static labels added to tenant namespaces, after the chart prepends targetLabel.
  tenantNamespaceCommonLabels: crownlabs.polito.it/gw-access=crownlabs-main-production,crownlabs.polito.it/instance-resources-replication=true
  # Label selector used by controllers to select managed resources.
  targetLabel: crownlabs.polito.it/operator-selector=production
  keycloak:
    url: "https://auth.crownlabs.example.com/"
    realm: crownlabs
    clientId: client-operator
    clientSecret: my-awesome-secret
    rolesClientId: client-api-server
    # compatibilityMode: set to true for compatibility with older Keycloak versions
    compatibilityMode: false
  mydrivePVCsSize: 1Gi
  # Namespace hosting the public snapshot catalog. Volumes stored here can be read by every tenant.
  # Also used by public-snapshots ImageList sources that omit namespace.
  # Check that this namespace exists before deploying: it must be created manually.
  snapshotPublicNamespace: "crownlabs-public-snapshots"
  # Keycloak group whose members can publish snapshots into the public catalog. Leave empty to let
  # only the snapshot webhook bypass groups do it.
  snapshotPublisherGroup: "kubernetes:image-publisher"
  mydrivePVCsStorageClassName: rook-nfs
  mydrivePVCsNamespace: mydrive-pvcs

  # If true, the reconciliation will wait for the user to be verified in Keycloak before creating resources.
  # If false, resources will be created immediately after the Tenant is created.
  waitUserVerification: true

  maxConcurrentReconciles: 1
  sandboxClusterRole: crownlabs-sandbox
  tenantNamespaceKeepAlive: 168h
  tenant:
    resourcecaps:
      # Maximum number of virtual cpus that can be requested by a tenant. 0 means unlimited.
      cpu: 25
      # Maximum amount of memory that can be requested by a tenant (expressed in GB). 0 means unlimited.
      memory: 50
      # Maximum number of instances that can be created by a tenant. 0 means unlimited.
      instances: 10

  maxConcurrentShVolReconciles: 1
  sharedVolumeOptions:
    storageClass: rook-nfs
  imageList:
    configFile: /etc/config/registries.yaml
    updateInterval: 600
    registries:
      - name: harbor-registry-standalone
        type: harbor
        url: http://harbor-core.harbor:80
        registryName: harbor.ng.crownlabs.polito.it
        username: ""
        password: ""
        imageListName: harbor-standalone
        project: crownlabs-standalone
      - name: harbor-registry-containerdisks
        type: harbor
        url: http://harbor-core.harbor:80
        registryName: harbor.ng.crownlabs.polito.it
        username: ""
        password: ""
        imageListName: harbor-containerdisks
        project: crownlabs-containerdisks

  # Used only when features.crownJob is true.
  crownJob:
    # The RuntimeClass of the jobs that request a resource, as resource=runtimeClass,... (e.g. nvidia.com/gpu=nvidia).
    runtimeClasses: ""
    # The maximum run time of a job when neither its Template nor its Workspace sets one (a number followed by m, h or d).
    defaultMaxRunTime: "2h"
    # How long a finished Job, and each log helper, is kept with its pods, which keep the disk of the instance in use.
    # The CrownJob itself is kept.
    finishedJobTTL: "10m"
    # The image of the Jobs that save the log of each job pod: it must contain /go-runner and /bin/kubectl.
    logHelperImage: "registry.k8s.io/kubectl:v1.34.1"
    maxConcurrentReconciles: 1

  pvcMirrorProvisioner:
    provisionerName: pmp.crownlabs.polito.it
    storageClass:
      name: pvc-mirror
      deploy: false

image:
  repository: crownlabs/tenant-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart version.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

deploymentAnnotations:
  reloader.stakater.com/auto: "true"
podAnnotations: {}

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 20000
  runAsGroup: 20000
  privileged: false

resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 1Gi
    cpu: 100m

webhook:
  deployment:
    certsMount: /tmp/k8s-webhook-server/serving-certs/
    webhookBypassGroups: system:masters,system:serviceaccounts,kubernetes:admin
    snapshotWebhookBypassGroups: system:masters,kubernetes:admin
    baseWorkspaces: utilities
  enableMutating: false
  enableValidating: false
  clusterIssuer: self-signed

rbacResourcesName: crownlabs-operator
