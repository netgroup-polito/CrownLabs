{{ if .Values.configurations.features.imageList }}
{{- $registries := deepCopy .Values.configurations.imageList.registries }}
{{- range $source := $registries }}
{{- if and (eq $source.type "public-snapshots") (not $source.namespace) }}
{{- $_ := set $source "namespace" (required "configurations.snapshotPublicNamespace is required when a public-snapshots source omits namespace" $.Values.configurations.snapshotPublicNamespace) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-lists-sources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
data:
  registries: |
    {{- $registries | toYaml | nindent 4 }}

{{ end }}
