apiVersion: crownlabs.polito.it/v1alpha2
kind: ClusterFlavor
metadata:
  name: k8s-1-26-basic
  namespace: workspace-olympia
spec:
  version: v1.26.0
  controlPlane:
    cpu: 1
    memory: 1Gi
    replicas: 1
    dataStoreName: default
    apiServerResources:
      cpu: "500m"
      memory: "512Mi"
    schedulerResources:
      cpu: "100m"
      memory: "128Mi"
    controllerManagerResources:
      cpu: "100m"
      memory: "128Mi"
    konnectivityResources:
      cpu: "100m"
      memory: "128Mi"
  workers:
    image: quay.io/capk/ubuntu-2004-container-disk:v1.26.0
  addonList:
    - name: cilium
      repoURL: https://helm.cilium.io
      chartName: cilium
      version: 1.16.4
      namespace: kube-system
    - name: ingress-nginx
      repoURL: https://kubernetes.github.io/ingress-nginx
      chartName: ingress-nginx
      version: 4.11.3
      namespace: ingress-nginx
      values: |
        controller:
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
          ingressClassResource:
            default: true
